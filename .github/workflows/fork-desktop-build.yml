# Builds unsigned Windows, macOS and Linux installers for a chosen tag or branch and keeps them as
# run artifacts. Nothing here publishes, deploys, or uses secrets.
name: Fork desktop build

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Tag, branch or commit to build
        required: true
        default: v1

permissions:
  contents: read

jobs:
  windows-x64:
    name: Windows x64 installer
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.ref }}
          sparse-checkout: |
            /*
            !/.repos/
            !/apps/mobile/modules/t3-terminal/Vendor/**/*.a
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: ./.github/actions/setup-ci-deps
        with:
          install: "false"

      # On a Vite+ cache hit the shared action adds a bash-style path that pwsh cannot read.
      - name: Add Vite+ to PATH
        run: Add-Content $env:GITHUB_PATH "$HOME\.vite-plus\bin"

      - name: Install dependencies
        run: vp install --frozen-lockfile

      # Unsigned: Windows SmartScreen shows an "unknown publisher" prompt on install.
      # A native Windows build would add ~39 prepared compile-cache files, which the 80-file payload
      # limit does not allow (upstream builds Windows on Linux, where that step is skipped). This
      # flag skips them; the app then compiles on first start.
      - name: Build installer
        env:
          T3CODE_DESKTOP_UNTRUSTED_BUNDLE: "true"
        run: vp run dist:desktop:win:x64

      - name: Upload installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cmdeck-windows-x64-installer
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14

  # Unsigned and not notarized: macOS Gatekeeper blocks the first open until you allow it in
  # System Settings > Privacy & Security.
  macos-arm64:
    name: macOS arm64 disk image
    # The Apple Speech helper needs Xcode 26.
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.ref }}
          sparse-checkout: |
            /*
            !/.repos/
            !/apps/mobile/modules/t3-terminal/Vendor/**/*.a
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: ./.github/actions/setup-ci-deps
        with:
          install: "false"

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Build disk image
        run: vp run dist:desktop:dmg:arm64

      - name: Upload disk image
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cmdeck-macos-arm64-dmg
          path: release/*.dmg
          if-no-files-found: error
          retention-days: 14

  linux-x64:
    name: Linux x64 AppImage and deb
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.ref }}
          sparse-checkout: |
            /*
            !/.repos/
            !/apps/mobile/modules/t3-terminal/Vendor/**/*.a
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: ./.github/actions/setup-ci-deps
        with:
          install: "false"

      - name: Install dependencies
        run: vp install --frozen-lockfile

      # The browser secret helper links against libsecret; ImageMagick renders the package icons.
      - name: Install build libraries
        run: sudo apt-get update -o Acquire::Languages=none && sudo apt-get install -y libsecret-1-dev pkg-config imagemagick

      - name: Build AppImage and deb
        run: vp run dist:desktop:linux

      - name: Upload packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cmdeck-linux-x64-packages
          path: |
            release/*.AppImage
            release/*.deb
          if-no-files-found: error
          retention-days: 14
