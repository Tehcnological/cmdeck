# Regenerates derived files the fork's developers cannot produce locally (translation catalogs,
# formatting, brand icons) and uploads them as a patch to review and commit by hand. Runs only
# when a pull request gets the `run-fixups` label; it never pushes, publishes or uses secrets.
name: Fork fixups

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read

jobs:
  generated:
    name: i18n, format, Android icons
    if: ${{ github.event.label.name == 'run-fixups' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          sparse-checkout: |
            /*
            !/.repos/
            !/apps/mobile/modules/t3-terminal/Vendor/**/*.a
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: ./.github/actions/setup-ci-deps
        with:
          install: "false"

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Regenerate translation catalogs
        run: |
          for app in apps/web apps/mobile apps/desktop; do
            (cd "$app" && vp run i18n:generate)
          done

      - name: Export Android icons from the SVG sources
        run: vp run icons:export:android || echo "::warning::Android icon export failed; see log"

      - name: Format
        run: vp fmt

      - name: Upload patch
        if: always()
        run: git add -A && git diff --cached --binary > generated.patch && git diff --cached --stat | tail -5

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: generated-patch
          path: generated.patch

  icons:
    name: Brand icons (Icon Composer)
    if: ${{ github.event.label.name == 'run-fixups' }}
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          sparse-checkout: |
            /*
            !/.repos/
            !/apps/mobile/modules/t3-terminal/Vendor/**/*.a
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: ./.github/actions/setup-ci-deps
        with:
          install: "false"

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Export brand icons
        run: vp run icons:export

      - name: Upload patch
        if: always()
        run: git add -A && git diff --cached --binary > icons.patch && git diff --cached --stat | tail -40

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: icons-patch
          path: icons.patch
