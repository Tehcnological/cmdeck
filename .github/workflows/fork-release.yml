# Builds unsigned Windows, macOS and Linux installers for a release tag and publishes them, with the
# update feeds the desktop app reads and their blockmaps, as a GitHub release of this repository.
# Stable tag vN is app version N.0.0, carries latest*.yml and becomes the latest release. Beta tag
# vN-beta.M is app version N.0.0-beta.M, carries beta*.yml and is published as a prerelease, which
# GitHub never makes the latest release, so Stable apps never see it. No secrets besides the token.
name: Fork release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and publish (vN or vN-beta.M)
        required: true

permissions:
  contents: read

concurrency:
  group: fork-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  check-version:
    name: Check tag and version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ env.RELEASE_TAG }}
          sparse-checkout: |
            apps/desktop/package.json
            apps/server/package.json
          sparse-checkout-cone-mode: false

      - name: Tag vN matches N.0.0, vN-beta.M matches N.0.0-beta.M
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v([1-9][0-9]*)(-beta\.[1-9][0-9]*)?$ ]]; then
            echo "::error::Release tags are vN (v1, v2, ...) or vN-beta.M (v3-beta.1, ...); got '$RELEASE_TAG'." >&2
            exit 1
          fi
          expected="${BASH_REMATCH[1]}.0.0${BASH_REMATCH[2]}"
          for manifest in apps/desktop/package.json apps/server/package.json; do
            version="$(jq -r .version "$manifest")"
            if [ "$version" != "$expected" ]; then
              echo "::error::$manifest is version $version; tag $RELEASE_TAG needs $expected." >&2
              exit 1
            fi
          done

  windows-x64:
    name: Windows x64 installer
    needs: check-version
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ env.RELEASE_TAG }}
          sparse-checkout: |
            /*
            !/.repos/
            !/apps/mobile/modules/t3-terminal/Vendor/**/*.a
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: ./.github/actions/setup-ci-deps
        with:
          install: "false"

      # On a Vite+ cache hit the shared action adds a bash-style path that pwsh cannot read.
      - name: Add Vite+ to PATH
        run: Add-Content $env:GITHUB_PATH "$HOME\.vite-plus\bin"

      - name: Install dependencies
        run: vp install --frozen-lockfile

      # Unsigned; see fork-desktop-build.yml for why the compile cache is skipped on Windows.
      - name: Build installer
        env:
          T3CODE_DESKTOP_UNTRUSTED_BUNDLE: "true"
        run: vp run dist:desktop:win:x64

      - name: Upload installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-windows-x64
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml
            release/beta.yml
          if-no-files-found: error
          retention-days: 7

  # Ad-hoc signed only; the app installs its own updates (Squirrel.Mac needs a real signature).
  macos-arm64:
    name: macOS arm64 disk image and zip
    # The Apple Speech helper needs Xcode 26.
    runs-on: macos-26
    needs: check-version
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ env.RELEASE_TAG }}
          sparse-checkout: |
            /*
            !/.repos/
            !/apps/mobile/modules/t3-terminal/Vendor/**/*.a
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: ./.github/actions/setup-ci-deps
        with:
          install: "false"

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Build disk image and zip
        run: vp run dist:desktop:dmg:arm64

      - name: Upload disk image and zip
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-macos-arm64
          path: |
            release/*.dmg
            release/*.zip
            release/*.zip.blockmap
            release/latest-mac.yml
            release/beta-mac.yml
          if-no-files-found: error
          retention-days: 7

  linux-x64:
    name: Linux x64 AppImage and deb
    # Natives compiled here must stay within the build's glibc 2.39 ceiling (Ubuntu 24.04).
    runs-on: ubuntu-24.04
    needs: check-version
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ env.RELEASE_TAG }}
          sparse-checkout: |
            /*
            !/.repos/
            !/apps/mobile/modules/t3-terminal/Vendor/**/*.a
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: ./.github/actions/setup-ci-deps
        with:
          install: "false"

      - name: Install dependencies
        run: vp install --frozen-lockfile

      # The browser secret helper links against libsecret; ImageMagick renders the package icons.
      - name: Install build libraries
        run: sudo apt-get update -o Acquire::Languages=none && sudo apt-get install -y libsecret-1-dev pkg-config imagemagick

      - name: Build AppImage and deb
        run: vp run dist:desktop:linux

      - name: Upload packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-linux-x64
          path: |
            release/*.AppImage
            release/*.deb
            release/latest-linux.yml
            release/beta-linux.yml
          if-no-files-found: error
          retention-days: 7

  # The CLI archives that SSH bootstraps, `cmdeck service install` and `cmdeck update` download: one
  # per CLI_ARCHIVE_PLATFORM_KEYS entry in packages/shared/src/cliRelease.ts, each built natively and
  # unsigned. There is no darwin-x64 archive because Node single-executables do not run there.
  cli-archives:
    name: CLI archive ${{ matrix.key }}
    needs: check-version
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { key: darwin-arm64, platform: mac, arch: arm64, runner: macos-26 }
          - { key: linux-arm64, platform: linux, arch: arm64, runner: ubuntu-24.04-arm }
          - { key: linux-x64, platform: linux, arch: x64, runner: ubuntu-24.04 }
          - { key: win32-arm64, platform: win, arch: arm64, runner: windows-11-arm }
          - { key: win32-x64, platform: win, arch: x64, runner: windows-2025 }
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ env.RELEASE_TAG }}
          sparse-checkout: |
            /*
            !/.repos/
            !/apps/mobile/modules/t3-terminal/Vendor/**/*.a
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: ./.github/actions/setup-ci-deps
        with:
          install: "false"

      # On a Vite+ cache hit the shared action adds a bash-style path that pwsh cannot read.
      - name: Add Vite+ to PATH
        if: runner.os == 'Windows'
        shell: pwsh
        run: Add-Content $env:GITHUB_PATH "$HOME\.vite-plus\bin"

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable

      # The Linux archive ships libatomic.so.1 and points t3's RUNPATH at it.
      - name: Install patchelf
        if: matrix.platform == 'linux'
        run: command -v patchelf || { sudo apt-get update -o Acquire::Languages=none && sudo apt-get install -y patchelf; }

      # Releases and betas carry production branding, as the desktop build gives them.
      - name: Build server and web client
        run: |
          vp run --filter t3 build
          node scripts/apply-web-brand-assets.ts production apps/server/dist/client

      - name: Build resource monitor
        run: |
          set -euo pipefail
          cargo build --locked --release --manifest-path native/resource-monitor/Cargo.toml
          exe=t3-resource-monitor
          if [ "${{ matrix.platform }}" = win ]; then exe=t3-resource-monitor.exe; fi
          mkdir -p "cli-resource-monitor/${{ matrix.key }}"
          cp "native/resource-monitor/target/release/$exe" "cli-resource-monitor/${{ matrix.key }}/$exe"

      - name: Build CLI archive
        run: |
          set -euo pipefail
          node apps/server/scripts/cli.ts build-exe --verbose
          node scripts/build-cli-archive.ts \
            --platform "${{ matrix.platform }}" \
            --arch "${{ matrix.arch }}" \
            --version "$(node -p 'require("./apps/server/package.json").version')" \
            --resource-monitor-dir cli-resource-monitor \
            --output-dir release-cli

      - name: Smoke-test CLI archive
        run: |
          set -euo pipefail
          version="$(node -p 'require("./apps/server/package.json").version')"
          stem="t3-$version-${{ matrix.key }}"
          mkdir smoke
          if [ "${{ matrix.platform }}" = win ]; then
            # Git Bash's GNU tar cannot read zip; System32 bsdtar can.
            /c/Windows/System32/tar.exe -xf "release-cli/$stem.zip" -C smoke
            exe="smoke/$stem/t3.exe"
          else
            tar -xzf "release-cli/$stem.tar.gz" -C smoke
            exe="smoke/$stem/t3"
          fi
          actual="$("$exe" --version)"
          [ "$actual" = "t3 v$version" ] || { echo "::error::$stem reports '$actual', not 't3 v$version'." >&2; exit 1; }

      - name: Upload CLI archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-cli-${{ matrix.key }}
          path: release-cli/*
          if-no-files-found: error
          retention-days: 7
          # The archive is already gzip or zip.
          compression-level: 0

  publish:
    name: Publish GitHub release
    needs: [windows-x64, macos-arm64, linux-x64, cli-archives]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Check release assets
        working-directory: release-assets
        # A beta carries only beta*.yml feeds and a stable release only latest*.yml.
        run: |
          shopt -s nullglob
          if [[ "$RELEASE_TAG" == *-beta.* ]]; then feed=beta other=latest; else feed=latest other=beta; fi
          # A name without a wildcard stays in the list even when nullglob is on, so keep only files
          # that exist.
          stray=()
          for candidate in "$other".yml "$other"-*.yml; do
            [ -e "$candidate" ] && stray+=("$candidate")
          done
          [ "${#stray[@]}" -eq 0 ] || { echo "::error::$RELEASE_TAG must not carry ${stray[*]}." >&2; exit 1; }
          for pattern in '*.exe' '*.exe.blockmap' "$feed.yml" '*.dmg' '*.zip' '*.zip.blockmap' \
            "$feed-mac.yml" '*.AppImage' '*.deb' "$feed-linux.yml"; do
            files=($pattern)
            [ "${#files[@]}" -gt 0 ] || { echo "::error::No release asset matches $pattern." >&2; exit 1; }
          done
          # SSH bootstraps and `cmdeck update` verify the CLI archives against SHA256SUMS.
          version="${RELEASE_TAG#v}"
          major="${version%%-*}"
          version="$major.0.0${version#"$major"}"
          archives=()
          for key in darwin-arm64 linux-arm64 linux-x64 win32-arm64 win32-x64; do
            archive="t3-$version-$key.tar.gz"
            [[ "$key" == win32-* ]] && archive="t3-$version-$key.zip"
            [ -f "$archive" ] || { echo "::error::Missing CLI archive $archive." >&2; exit 1; }
            archives+=("$archive")
          done
          sha256sum -- "${archives[@]}" > SHA256SUMS
          cat SHA256SUMS
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # A draft hides the release from the update feed until every asset is uploaded. A beta is a
      # prerelease and never latest: Stable apps read only the latest release, so they never see it.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [[ "$RELEASE_TAG" == *-beta.* ]]; then
            kind=(--prerelease=true --latest=false)
          else
            kind=(--prerelease=false --latest)
          fi
          if ! gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft "${kind[@]}" --title "CMDeck $RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false "${kind[@]}"
