# Builds unsigned Windows, macOS and Linux installers for a release tag vN and publishes them, with
# the update feeds the desktop app reads (latest*.yml and blockmaps), as GitHub release vN of this
# repository. Release vN must be app version N.0.0. No secrets besides the run's own token.
name: Fork release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and publish (vN)
        required: true

permissions:
  contents: read

concurrency:
  group: fork-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  check-version:
    name: Check tag and version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ env.RELEASE_TAG }}
          sparse-checkout: |
            apps/desktop/package.json
            apps/server/package.json
          sparse-checkout-cone-mode: false

      - name: Tag vN matches version N.0.0
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[1-9][0-9]*$ ]]; then
            echo "::error::Release tags are vN (v1, v2, ...); got '$RELEASE_TAG'." >&2
            exit 1
          fi
          expected="${RELEASE_TAG#v}.0.0"
          for manifest in apps/desktop/package.json apps/server/package.json; do
            version="$(jq -r .version "$manifest")"
            if [ "$version" != "$expected" ]; then
              echo "::error::$manifest is version $version; tag $RELEASE_TAG needs $expected." >&2
              exit 1
            fi
          done

  windows-x64:
    name: Windows x64 installer
    needs: check-version
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ env.RELEASE_TAG }}
          sparse-checkout: |
            /*
            !/.repos/
            !/apps/mobile/modules/t3-terminal/Vendor/**/*.a
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: ./.github/actions/setup-ci-deps
        with:
          install: "false"

      # On a Vite+ cache hit the shared action adds a bash-style path that pwsh cannot read.
      - name: Add Vite+ to PATH
        run: Add-Content $env:GITHUB_PATH "$HOME\.vite-plus\bin"

      - name: Install dependencies
        run: vp install --frozen-lockfile

      # Unsigned; see fork-desktop-build.yml for why the compile cache is skipped on Windows.
      - name: Build installer
        env:
          T3CODE_DESKTOP_UNTRUSTED_BUNDLE: "true"
        run: vp run dist:desktop:win:x64

      - name: Upload installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-windows-x64
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml
          if-no-files-found: error
          retention-days: 7

  # Ad-hoc signed only; the app installs its own updates (Squirrel.Mac needs a real signature).
  macos-arm64:
    name: macOS arm64 disk image and zip
    # The Apple Speech helper needs Xcode 26.
    runs-on: macos-26
    needs: check-version
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ env.RELEASE_TAG }}
          sparse-checkout: |
            /*
            !/.repos/
            !/apps/mobile/modules/t3-terminal/Vendor/**/*.a
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: ./.github/actions/setup-ci-deps
        with:
          install: "false"

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Build disk image and zip
        run: vp run dist:desktop:dmg:arm64

      - name: Upload disk image and zip
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-macos-arm64
          path: |
            release/*.dmg
            release/*.zip
            release/*.zip.blockmap
            release/latest-mac.yml
          if-no-files-found: error
          retention-days: 7

  linux-x64:
    name: Linux x64 AppImage and deb
    # Natives compiled here must stay within the build's glibc 2.39 ceiling (Ubuntu 24.04).
    runs-on: ubuntu-24.04
    needs: check-version
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ env.RELEASE_TAG }}
          sparse-checkout: |
            /*
            !/.repos/
            !/apps/mobile/modules/t3-terminal/Vendor/**/*.a
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: ./.github/actions/setup-ci-deps
        with:
          install: "false"

      - name: Install dependencies
        run: vp install --frozen-lockfile

      # The browser secret helper links against libsecret; ImageMagick renders the package icons.
      - name: Install build libraries
        run: sudo apt-get update -o Acquire::Languages=none && sudo apt-get install -y libsecret-1-dev pkg-config imagemagick

      - name: Build AppImage and deb
        run: vp run dist:desktop:linux

      - name: Upload packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-linux-x64
          path: |
            release/*.AppImage
            release/*.deb
            release/latest-linux.yml
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub release
    needs: [windows-x64, macos-arm64, linux-x64]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Check release assets
        working-directory: release-assets
        run: |
          shopt -s nullglob
          for pattern in '*.exe' '*.exe.blockmap' latest.yml '*.dmg' '*.zip' '*.zip.blockmap' \
            latest-mac.yml '*.AppImage' '*.deb' latest-linux.yml; do
            files=($pattern)
            [ "${#files[@]}" -gt 0 ] || { echo "::error::No release asset matches $pattern." >&2; exit 1; }
          done
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # A draft hides the release from the update feed until every asset is uploaded.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "CMDeck $RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest
